[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-to-t2"
version = "0.1.0"
description = "Transfer Unitree G1 joint-PD policies to Booster T2 via remapping + fine-tune"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
]

[project.optional-dependencies]
sim = ["mujoco", "opencv-python-headless", "imageio", "imageio-ffmpeg"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["g1_to_t2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
